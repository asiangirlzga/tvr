name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "phone-voice/**"
      - ".github/workflows/build-voice-apk.yml"
  pull_request:
    paths-ignore:
      - "phone-voice/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvr-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish rolling "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk tvr-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest tvr-debug.apk \
            --title "Latest build" \
            --notes "Debug-signed APK built from commit ${GITHUB_SHA::7}. Installs on phones and Android TV." \
            --prerelease
